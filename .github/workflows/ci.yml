name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.29"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --extra dev --extra mcp --locked
      - name: Lint
        run: uv run --extra dev --extra mcp --locked ruff check .
      - name: Formatting
        run: uv run --extra dev --extra mcp --locked ruff format --check .
      - name: Tests
        run: uv run --extra dev --extra mcp --locked pytest -q
      - name: HTTP smoke test
        run: uv run --extra dev --extra mcp --locked python scripts/smoke.py
      - name: MCP stdio and Streamable HTTP smoke (no model calls)
        run: uv run --extra dev --extra mcp --locked python scripts/smoke_mcp.py
      - name: Offline retrieval evaluation (no API calls)
        run: uv run --extra dev --extra mcp --locked python scripts/evaluate.py
      - name: Frozen task timelines (no API calls)
        run: uv run --extra dev --extra mcp --locked python scripts/evaluate_tasks.py
      - name: Build package
        run: uv build
