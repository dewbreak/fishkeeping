[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "fishkeeping-memory"
version = "0.5.0"
description = "Human-memory-inspired, local-first memory service for agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "build>=1,<2", "Pillow==13.0.0"]
local = ["fastembed>=0.9.1,<0.10"]
vision = ["rapidocr==3.10.0", "onnxruntime==1.31.1", "Pillow==13.0.0"]
mcp = ["mcp>=2.3,<3"]

[project.scripts]
fishkeeping = "fishkeeping.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fishkeeping"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
